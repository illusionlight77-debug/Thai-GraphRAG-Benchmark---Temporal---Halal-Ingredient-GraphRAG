[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thaigraphrag"
version = "0.1.0"
description = "Thai GraphRAG + Benchmark — GraphRAG vs vanilla RAG on a Thai knowledge graph, with Temporal and Halal-Ingredient extensions."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["thaigraphrag*"]

[tool.pytest.ini_options]
pythonpath = ["."]
